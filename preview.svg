<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="Two real kelter answers. A clear support ticket is routed to the account team with 99 percent confidence and the action act, with the words it relied on highlighted. A vague ticket gets the action defer.">
  <style>
    .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lab{font-size:11px;letter-spacing:1.5px;fill:#8b949e}
    .tk{font-size:15px}.q{font-size:13px;fill:#8b949e}.opt{font-size:13px;fill:#6e7681}
    .ans{font-size:26px;font-weight:700;fill:#f0f6fc}.sure{font-size:14px;fill:#8b949e}
    .pill{font-size:13px;font-weight:700;letter-spacing:1px}
    .why{font-size:12.5px;fill:#8b949e}
    .ev{font-weight:700;animation:ev 9s infinite}
    .pick{animation:pick 9s infinite}
    .v1{animation:v1 9s infinite}.v2{animation:v2 9s infinite}
    @keyframes ev{0%,14%{fill:#c9d1d9}22%,100%{fill:#f2cc60}}
    @keyframes pick{0%,14%{fill:#6e7681}22%,100%{fill:#3fb950}}
    @keyframes v1{0%,24%{opacity:0}32%,100%{opacity:1}}
    @keyframes v2{0%,52%{opacity:0}60%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.ev,.pick,.v1,.v2{animation:none}}
  </style>
  <rect class="bg" width="920" height="330" rx="12"/>

  <rect class="card" x="20" y="20" width="430" height="290" rx="10"/>
  <text class="lab" x="40" y="50">SUPPORT TICKET</text>
  <text class="tk mono" x="40" y="80">Customer: <tspan class="ev" fill="#f2cc60">I forgot my password</tspan> and</text>
  <text class="tk mono" x="40" y="102"><tspan class="ev" fill="#f2cc60">cannot log in to my account.</tspan></text>
  <text class="q" x="40" y="138">Which team should handle it?</text>
  <text class="opt mono" x="40" y="160">billing · shipping · <tspan class="pick" fill="#3fb950">account</tspan> · technical · other</text>
  <line x1="40" y1="182" x2="430" y2="182" stroke="#30363d"/>
  <g class="v1">
    <text class="ans" x="40" y="224">account</text>
    <text class="sure" x="160" y="222">99% sure</text>
    <rect x="352" y="202" width="78" height="30" rx="15" fill="#238636"/>
    <text class="pill" x="391" y="222" text-anchor="middle" fill="#ffffff">ACT</text>
    <text class="why" x="40" y="258">Safe to act. The highlighted words are the evidence:</text>
    <text class="why" x="40" y="277">they give the same answer alone, and removing them changes it.</text>
  </g>

  <rect class="card" x="470" y="20" width="430" height="290" rx="10"/>
  <text class="lab" x="490" y="50">SUPPORT TICKET</text>
  <text class="tk mono" x="490" y="80">Customer: Something is wrong,</text>
  <text class="tk mono" x="490" y="102">please help.</text>
  <text class="q" x="490" y="138">Which team should handle it?</text>
  <text class="opt mono" x="490" y="160">billing · shipping · account · technical · other</text>
  <line x1="490" y1="182" x2="880" y2="182" stroke="#30363d"/>
  <g class="v2">
    <text class="ans" x="490" y="224">other?</text>
    <text class="sure" x="590" y="222">37% sure</text>
    <rect x="786" y="202" width="94" height="30" rx="15" fill="#9e6a03"/>
    <text class="pill" x="833" y="222" text-anchor="middle" fill="#ffffff">DEFER</text>
    <text class="why" x="490" y="258">Too vague. No words to rest an answer on,</text>
    <text class="why" x="490" y="277">so kelter passes instead of guessing.</text>
  </g>
</svg>
